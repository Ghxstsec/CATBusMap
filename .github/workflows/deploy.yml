name: Actualizar datos y desplegar

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * *" # cada día a las 04:15 UTC (el GTFS se regenera a diario)
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar datos desde el GTFS de la Generalitat
        run: python3 scripts/build_data.py
      - name: Desplegar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=catbusmap --branch=main
